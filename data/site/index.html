<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <!-- Basic CSS -->
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f8;
            color: #333;
        }

        header {
            background-color: #1e90ff;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        main {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
        }

        footer {
            text-align: center;
            padding: 1rem;
            background-color: #eee;
            margin-top: 2rem;
            font-size: 0.9rem;
        }

        button {
            padding: 0.6rem 1rem;
            border: none;
            background-color: #1e90ff;
            color: white;
            cursor: pointer;
            border-radius: 4px;
        }

        button:hover {
            background-color: #187bcd;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>This is a simple HTML index page</p>
    </header>

    <main>
        <h2>Hello 👋</h2>
        <p>
            This is your starting point. You can add content, images,
            links, or connect this page to CSS and JavaScript files.
        </p>

        <button onclick="sayHello()">Click Me</button>
    </main>

    <footer>
        © 2026 Your Name
    </footer>

    <!-- JavaScript -->
    <script>
        function sayHello() {
            alert("Hello! Your index.html is working.");
        }
    </script>

</body>
</html>
