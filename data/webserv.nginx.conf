server {
	listen 7070;

	root	./data/www/YoupiBanane;
	index	youpi.bad_extension;

	location .bla$ {
		cgi_exec		/cgi-bin/cgi_tester;
		allowed_methods	GET POST;
	}

	location .py$ {
		cgi				on;
		root			./data/www/YoupiBanane/cgi-bin;
		allowed_methods	GET POST;
	}

	location /cgi-bin {
		allowed_methods GET POST;
	}

	location /upload/ {
		allowed_methods GET POST;
	}
}


server {
	listen 8080;
	root ./data/www/orel_website;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /upload/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location .py$ {
		cgi				on;
		root 			./data/www/orel_website/cgi-bin;
		cgi_exec		/usr/bin/python3;
		allowed_methods	GET POST;
	}
}


server {
	listen 9090;


	root ./data/www/simon_website;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /files/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location .py$ {
		virtual on;
	}

	location /cgi-bin {
		allowed_methods GET POST;
		cgi_exec		/cgi-bin/python3;
		cgi on;
	}
}
