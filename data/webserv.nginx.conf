server {
	listen 8080;


	root ./data/orel_website;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /upload/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location .bla$ {
		allowed_methods GET POST;
	}

	location .py$ {
		virtual		on;
	}

	location /cgi-bin {
		allowed_methods GET POST;
		cgi on;
	}
}

server {
	listen 9090;


	root ./data/simon_website;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /files/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location .py$ {
		virtual on;
	}

	location /cgi-bin {
		cgi on;
	}
}
