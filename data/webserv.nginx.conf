server {
	listen 8080;
	root ./data/website_aurel;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		3599;

	location /files/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location /error_pages {
		root ./lol;
		alias ./data/script;
		index index.html;
		allowed_methods GET;
	}

	location /animals/ {
		root	data/zoo;
	}

	location /createuser {
		virtual true;
	}

	location .sh$ {
	}

	location .py$ {
	}

	location /cgi-bin {
	}
}
