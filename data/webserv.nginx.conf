server {
	listen 8080;
	root ./data/site;


	index index.html index.php index.plouf;

	return 401 plouf.com;

	keepalive_timeout 500;

	location /error_pages {
		root ./data/;
		return 201 blabla;
		keepalive_timeout 100;
	}

	location /animals/ {
		autoindex	on;
	}

	server_name	plouf.com;

	location .php$ {
		root /data;
	}
}
