server {
	listen 8080;
	root ./data/site;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	allowed_methods	GET POST;

	keepalive_timeout 500;

	location /error_pages {
		root ./data;
		index index.html;
		allowed_methods POST;
		allowed_methods GET;
	}

	location /animals/ {
		root	data/zoo;
	}

	location /createuser {
	}

	location .sh$ {
	}

	location .py$ {
	}

	location /cgi-bin/ {
	}
}
