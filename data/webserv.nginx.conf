server {
	listen 7070;

	root	./data/www/YoupiBanane;
	index	youpi.bad_extension;

	allowed_methods	GET;
	max_body_size 1000000000;
	
	location /directory/ {
		alias	./data/www/YoupiBanane;
		allowed_methods GET POST;
	}

	location .bla$ {
		cgi_exec		/cgi-bin/cgi_tester;
		allowed_methods	GET POST;
	}

	location .py$ {
		cgi				on;
		root			./data/www/YoupiBanane/cgi-bin;
		allowed_methods	GET POST;
	}

	location /cgi-bin {
		allowed_methods GET POST;
	}

	location /post_body/ {
		allowed_methods POST;
		max_body_size	100;
	}
}


server {
	listen 8080;
	root ./data/www/orel_website;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /upload/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location .py$ {
		cgi				on;
		root 			./data/www/orel_website/cgi-bin;
		allowed_methods	GET POST;
	}

	location .sh$ {
		cgi		on;
		root	./data/www/orel_website/cgi-bin;
	}
}

server {
	listen 9090;
	root ./data/www/aurore_website;
	server_name	wow.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /upload/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}
	
	location .wow$ {
		cgi_exec		/cgi-bin/get_lab.py;
		allowed_methods	GET;
	}

	location .py$ {
		cgi				on;
		alias 			/data/www/aurore_website/cgi-bin;
		allowed_methods	GET POST;
	}

	location .sh$ {
		cgi		on;
		alias	/data/www/aurore_website/cgi-bin;
	}
}

server {
	listen 9090;

	root ./data/www/simon_website;
	server_name	plouf.com;

	index index.html index.php index.plouf;

	keepalive_timeout	599;
	keepalive_time		359;

	location /files/ {
		allowed_methods GET POST DELETE;
		autoindex		on;
	}

	location .py$ {
		virtual on;
	}

	location /cgi-bin {
		allowed_methods GET POST;
		cgi on;
	}
}
