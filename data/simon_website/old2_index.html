<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Webserv Test</title>
</head>
<body>

<h1>42 Webserv Test Page</h1>

<hr>

<!-- LOGIN FORM -->
<h2>Login (POST)</h2>
<form method="POST" action="/login">
    <label>
        Username:
        <input type="text" name="username">
    </label><br><br>

    <label>
        Password:
        <input type="password" name="password">
    </label><br><br>

    <input type="submit" value="Login">
</form>

<hr>

<!-- COMMENT FORM -->
<h2>Post a Comment (POST)</h2>
<form method="POST" action="/comment">
    <textarea name="comment" rows="5" cols="40"></textarea><br><br>
    <input type="submit" value="Send Comment">
</form>

<hr>

<!-- FILE UPLOAD TEST -->
<h2>File Upload (multipart/form-data)</h2>
<form method="POST" action="/upload" enctype="multipart/form-data">
    <input type="file" name="file"><br><br>
    <input type="submit" value="Upload">
</form>

<hr>

<!-- DELETE METHOD TEST -->
<h2>DELETE request (manual test)</h2>
<p>Use curl:</p>
<pre>
curl -X DELETE http://localhost:8080/resource
</pre>

<hr>

<!-- REDIRECTION TEST -->
<h2>Redirection</h2>
<a href="/redirect">Test redirection (301 / 302)</a>

<hr>

<!-- ERROR TEST -->
<h2>Error pages</h2>
<ul>
    <li><a href="/does_not_exist">404 Not Found</a></li>
    <li><a href="/forbidden">403 Forbidden</a></li>
</ul>

</body>
</html>
