server {
	listen 7070;

	root	./data/www/YoupiBanane;
	index	youpi.bad_extension;

	allowed_methods	GET;
	max_body_size 1000000000;
	
	location /directory/ {
		alias	./data/www/YoupiBanane;
		allowed_methods GET POST;
	}

	location .bla$ {
		cgi_exec		/cgi-bin/cgi_tester;
		allowed_methods	GET POST;
	}

	location .py$ {
		cgi				on;
		root			./data/www/YoupiBanane/cgi-bin;
		allowed_methods	GET POST;
	}

	location /cgi-bin {
		allowed_methods GET POST;
	}

	location /post_body/ {
		allowed_methods POST;
		max_body_size	100;
	}
}