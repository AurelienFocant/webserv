<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>404 // NOT FOUND</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060810;--cyan:#00d4ff;--pink:#ff2d6b;--muted:#4a6080;--dim:#1e2a3a;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:'Share Tech Mono',monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:40px;}
  body::before{content:'';position:fixed;inset:0;
    background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,0.08) 2px,rgba(0,0,0,0.08) 4px);
    pointer-events:none;}
  .code{font-family:'Orbitron',monospace;font-size:clamp(80px,15vw,160px);
    font-weight:900;color:var(--pink);text-shadow:0 0 40px var(--pink);
    line-height:1;margin-bottom:16px;animation:glitch 3s infinite;}
  @keyframes glitch{
    0%,90%,100%{text-shadow:0 0 40px var(--pink);}
    92%{text-shadow:-4px 0 var(--cyan),4px 0 var(--pink),0 0 40px var(--pink);}
    94%{text-shadow:4px 0 var(--cyan),-4px 0 var(--pink),0 0 40px var(--pink);}
  }
  .ascii{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:24px;}
  .msg{font-size:14px;color:var(--cyan);letter-spacing:3px;margin-bottom:8px;}
  .sub{font-size:11px;color:var(--muted);letter-spacing:2px;margin-bottom:32px;}
  a{display:inline-block;padding:10px 24px;border:1px solid var(--cyan);
    color:var(--cyan);text-decoration:none;font-size:11px;letter-spacing:2px;
    transition:all .3s;}
  a:hover{background:rgba(0,212,255,0.08);box-shadow:0 0 16px rgba(0,212,255,0.2);}
</style>
</head>
<body>
<div class="code">404</div>
<pre class="ascii">
  /\_/\
 ( x.x )   the raccoon couldn't find it
  > 🗑 <
</pre>
<div class="msg">RESOURCE NOT FOUND</div>
<div class="sub">The requested path does not exist on this server.</div>
<a href="/">← RETURN HOME</a>
</body>
</html>
