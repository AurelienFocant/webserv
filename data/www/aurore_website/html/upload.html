<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — Webserv</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/ico" sizes="32x32" href="../favicon.ico">
  <style>
    :root {
      --pink: #ff4fa3;
      --rose: #ff7fb3;
      --orange: #ff5a2f;
      --cyan: #259AA1;
      --blue: #203D57;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Playfair Display", serif;
      background: radial-gradient(circle at 50% 20%, #ff9266 0%, var(--orange) 40%, #e6452d 100%);
      color: #1a1a1a;
      overflow-x: hidden;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-radial-gradient(
        circle at center,
        rgba(255,255,255,0.18) 0px,
        rgba(255,255,255,0.18) 2px,
        transparent 3px,
        transparent 22px
      );
      opacity: 0.35;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 20px 90px;
      position: relative;
      z-index: 1;
    }

    /* ── Back link ── */
    .back {
      display: inline-block;
      margin-bottom: 40px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.8);
      text-decoration: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 2px;
      transition: color 0.2s;
    }
    .back:hover { color: white; }

    /* ── Title ── */
    .title-wrapper { text-align: center; margin-bottom: 48px; }

    h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: 3rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink);
      text-shadow:
        0 0 8px rgba(255,255,255,0.6),
        3px 3px 0 #fff,
        6px 6px 0 rgba(0,0,0,0.15);
      transform: skewX(-6deg);
    }

    .subtitle {
      margin-top: 12px;
      font-size: 1rem;
      color: #3d2b28;
    }

    /* ── Card ── */
    .card {
      padding: 40px;
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(255,255,255,0.88), rgba(255,255,255,0.58));
      backdrop-filter: blur(6px);
      box-shadow:
        0 12px 30px rgba(0,0,0,0.18),
        inset 0 0 10px rgba(255,255,255,0.4);
    }

    /* ── Drop zone ── */
    .dropzone {
      border: 2px dashed rgba(32,61,87,0.25);
      border-radius: 16px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: rgba(255,255,255,0.3);
      margin-bottom: 28px;
    }

    .dropzone.dragover {
      border-color: var(--cyan);
      background: rgba(37,154,161,0.08);
    }

    .dropzone input[type="file"] {
      display: none;
    }

    .drop-icon {
      font-size: 2.8rem;
      margin-bottom: 14px;
    }

    .drop-label {
      font-family: "Orbitron", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      color: var(--blue);
      text-transform: uppercase;
    }

    .drop-sub {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #666;
    }

    .file-chosen {
      margin-top: 14px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--cyan);
      min-height: 1.2em;
    }

    /* ── Button ── */
    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-family: "Orbitron", sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--rose));
      box-shadow:
        0 10px 25px rgba(0,0,0,0.2),
        inset 0 0 8px rgba(255,255,255,0.7);
      transition: transform 0.25s ease, background 0.25s ease;
    }

    button:hover {
      transform: translateY(-3px) scale(1.02);
      background: linear-gradient(135deg, var(--cyan), var(--blue));
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Status message ── */
    .status {
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 12px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-align: center;
      display: none;
    }

    .status.success {
      display: block;
      background: rgba(37,154,161,0.15);
      border: 1px solid rgba(37,154,161,0.4);
      color: #154875;
    }

    .status.error {
      display: block;
      background: rgba(255,79,163,0.12);
      border: 1px solid rgba(255,79,163,0.35);
      color: #8b1a4a;
    }

    @media (max-width: 700px) {
      h1 { font-size: 2.2rem; }
      .card { padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <a class="back" href="/">← Back to home</a>

    <div class="title-wrapper">
      <h1>Upload</h1>
      <p class="subtitle">Drop a file to send it to the server</p>
    </div>

    <div class="card">
      <form id="upload-form" method="POST" action="/upload/" enctype="multipart/form-data">
        <div class="dropzone" id="dropzone">
          <input type="file" name="file" id="file-input">
          <div class="drop-icon">📂</div>
          <div class="drop-label">Click or drag & drop</div>
          <div class="drop-sub">Any file type accepted</div>
          <div class="file-chosen" id="file-chosen"></div>
        </div>
        <button type="submit" id="submit-btn" disabled>Send file</button>
      </form>
      <div class="status" id="status"></div>
    </div>

  </div>

  <script>
    const dropzone   = document.getElementById('dropzone');
    const fileInput  = document.getElementById('file-input');
    const fileChosen = document.getElementById('file-chosen');
    const submitBtn  = document.getElementById('submit-btn');
    const status     = document.getElementById('status');
    const form       = document.getElementById('upload-form');

    // Open file picker on click
    dropzone.addEventListener('click', () => fileInput.click());

    // Update label when a file is selected
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        fileChosen.textContent = fileInput.files[0].name;
        submitBtn.disabled = false;
      }
    });

    // Drag & drop
    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      const dt = e.dataTransfer;
      if (dt.files.length) {
        fileInput.files = dt.files;
        fileChosen.textContent = dt.files[0].name;
        submitBtn.disabled = false;
      }
    });

    // Submit via fetch to show success/error inline
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!fileInput.files.length) return;

      const data = new FormData(form);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';
      status.className = 'status';

      fetch(form.action, { method: 'POST', body: data })
        .then(res => {
          if (res.ok || res.status === 201) {
            status.className = 'status success';
            status.textContent = '✓ ' + fileInput.files[0].name + ' uploaded successfully';
            fileChosen.textContent = '';
            fileInput.value = '';
          } else {
            status.className = 'status error';
            status.textContent = '✗ Server returned ' + res.status;
          }
        })
        .catch(() => {
          status.className = 'status error';
          status.textContent = '✗ Network error';
        })
        .finally(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send file';
        });
    });
  </script>
</body>
</html>
