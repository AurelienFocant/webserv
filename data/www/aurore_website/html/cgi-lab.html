<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CGI Lab — Webserv</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #ff4fa3;
      --rose: #ff7fb3;
      --orange: #ff5a2f;
      --yellow: #FBCB3E;
      --cyan: #259AA1;
      --blue: #203D57;
      --cream: #F8E2B9;
      --text: #1d1820;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Playfair Display", serif;
      color: var(--text);
      background: radial-gradient(circle at 50% 20%, #ff9266 0%, var(--orange) 40%, #e6452d 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-radial-gradient(
        circle at center,
        rgba(255, 255, 255, 0.18) 0px,
        rgba(255, 255, 255, 0.18) 2px,
        transparent 3px,
        transparent 22px
      );
      opacity: 0.35;
    }

    .container {
      position: relative;
      z-index: 1;
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 80px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .back-link,
    .mini-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-family: "Orbitron", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: white;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      backdrop-filter: blur(6px);
    }

    .hero {
      text-align: center;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2.9rem, 8vw, 5rem);
      line-height: 1;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink);
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.6),
        3px 3px 0 #fff,
        6px 6px 0 rgba(0, 0, 0, 0.15);
      transform: skewX(-6deg);
    }

    .subtitle {
      margin: 16px auto 0;
      max-width: 680px;
      font-size: 1.08rem;
      line-height: 1.7;
      color: #3d2b28;
    }

    .panel {
      padding: 34px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.6));
      backdrop-filter: blur(6px);
      box-shadow:
        0 16px 36px rgba(0, 0, 0, 0.2),
        inset 0 0 10px rgba(255, 255, 255, 0.35);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 18px;
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(32, 61, 87, 0.16);
    }

    .panel-title {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: 1.28rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .panel-note {
      margin: 8px 0 0;
      color: #352d34;
      line-height: 1.65;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(37, 154, 161, 0.12);
      color: var(--blue);
      font-family: "Orbitron", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 20px;
    }

    .demo-card {
      padding: 22px;
      border-radius: 18px;
      background: rgba(248, 226, 185, 0.48);
    }

    .demo-card strong {
      display: block;
      margin-bottom: 8px;
      font-family: "Orbitron", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue);
    }

    .demo-card p {
      margin: 0 0 14px;
      line-height: 1.6;
      color: #3b3137;
    }

    .mini-form {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .mini-form input,
    .mini-form select,
    .mini-form textarea {
      width: 100%;
      border: 1px solid rgba(32, 61, 87, 0.18);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      color: #1a1a1a;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    .mini-form textarea {
      resize: vertical;
      min-height: 110px;
    }

    .submit-btn,
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 14px 24px;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      font-family: "Orbitron", sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: transform 0.25s ease, background 0.25s ease;
    }

    .submit-btn {
      color: white;
      background: linear-gradient(135deg, var(--pink), var(--rose));
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.25),
        inset 0 0 8px rgba(255, 255, 255, 0.7);
    }

    .submit-btn:hover {
      transform: translateY(-3px) scale(1.03);
      background: linear-gradient(135deg, var(--cyan), var(--blue));
    }

    .secondary-actions {
      margin-top: 22px;
      display: flex;
      justify-content: center;
    }

    .secondary-btn {
      color: white;
      background: rgba(32, 61, 87, 0.82);
    }

    .secondary-btn:hover {
      transform: translateY(-2px);
      background: rgba(32, 61, 87, 0.94);
    }

    @media (max-width: 760px) {
      .panel-head,
      .topbar,
      .demo-grid {
        display: grid;
        grid-template-columns: 1fr;
      }

      .topbar {
        gap: 10px;
      }

      .mini-badge {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="back-link" href="/">← Back to index</a>
      <div class="mini-badge">CGI / POST </div>
    </div>

    <section class="hero">
      <h1>CGI Lab</h1>
      <p class="subtitle">
        Demos CGI : un formulaire POST qui envoie des données au script Python pour générer une réponse dynamique.
      </p>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">CGI Test Area</h2>
          <p class="panel-note">
            Test: <strong>POST CGI</strong>
          </p>
        </div>
      </div>

      <div class="demo-grid">
        <div class="demo-card">
          <strong>POST CGI — Compliment Generator</strong>
          <p>Envoie un POST à <code>/test.wow</code>.</p>

          <form class="mini-form" action="/test.wow" method="POST">
            <input name="name" placeholder="Your name" required>
            <select name="mood">
              <option value="curious">Curious</option>
              <option value="confident">Confident</option>
              <option value="dramatic">Dramatic</option>
            </select>
            <textarea name="message" placeholder="Say something..."></textarea>
            <button class="submit-btn" type="submit">Launch POST CGI</button>
          </form>
        </div>
    </section>
  </div>
</body>
</html>
