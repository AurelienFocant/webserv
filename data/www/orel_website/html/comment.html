<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Comment me!</title>
		<link rel="stylesheet" href="../css/styles.css">
		<link rel="icon" type="image/ico" sizes="32x32" href="../favicon.ico">
	</head>
	<body>

		<header>
			<a href="/" class="home-link">WebServ</a>
			<h1>Leave your best comment!</h1>
		</header>
		
		<div class="container">
			<form id="postComment" action="/comment.py" method="post" class="comment-box">
				<label for="comment">Your comment:</label><br>
				<textarea id="comment" name="comment" placeholder="Type your comment here..." required></textarea><br>
				<button type="submit">Send</button>
			</form>
		</div>

		<div class="container">
			<form id="postComment" action="/meuuuuh.py" method="get" class="comment-box">
				<label for="comment">Say it louder for the back:</label><br>
				<select name="animal">
					<option value="">-- Choose an animal --</option>
					<option value="cow">Cow</option>
					<option value="dragon">Dragon</option>
				</select>
				<textarea id="comment" name="comment" placeholder="Type your comment here..." required></textarea><br>
				<button type="submit">Send</button>
			</form>
		</div>

		<script src="../js/postComment.js"></script>

	</body>
</html>
