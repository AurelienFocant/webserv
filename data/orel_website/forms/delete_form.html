<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebServ File Manager</title>
    <link rel="stylesheet" href="../styles.css">
	<link rel="icon" type="image/ico" sizes="32x32" href="../favicon.ico">
</head>
<body>

    <header>
		<a href="/" class="home-link">WebServ</a>
        <h1>Server File Manager</h1>
        <p>Manage your server files safely. Delete files you no longer need with one click.</p>
    </header>

	<div class="container">
		<h2>Upload new files</h2>
		<form action="/upload/" method="post" enctype="multipart/form-data">
			<input type="file" id="myFile" name="newFile">
			<input type="submit">
		</form>
	</div>

	<div class="container">
		<h2>Files on Server</h2>
		<ul id="fileList">
			<li class="loading">Loading...</li>
		</ul>
	</div>

	<script>
		const DIRECTORY = "/upload/";

		function loadFiles() {
			fetch(DIRECTORY)
				.then(res => res.text())
				.then(htmlText => {
					const parser = new DOMParser();
					const doc = parser.parseFromString(htmlText, "text/html");

					const links = Array.from(doc.querySelectorAll("a"));
					const ul = document.getElementById("fileList");
					ul.innerHTML = "";

					if (links.length === 0) {
						ul.innerHTML = "<li class='loading'>No files found</li>";
						return;
					}

					links.forEach(link => {
						const href = link.getAttribute("href");
						if (href === "../") return;

						const li = document.createElement("li");
						li.textContent = href;

						const btn = document.createElement("button");
						btn.textContent = "Delete";
						btn.onclick = () => deleteFile(href);

						li.appendChild(btn);
						ul.appendChild(li);
					});
				})
				.catch(err => {
					console.error("Error loading files:", err);
					const ul = document.getElementById("fileList");
					ul.innerHTML = "<li class='loading'>Error loading files</li>";
				});
		}

		function deleteFile(filename) {
			if (!confirm(`Delete "${filename}"?`)) return;

			fetch(DIRECTORY + filename, { method: "DELETE" })
				.then(res => {
					if (!res.ok) throw new Error("Delete failed");
					alert(`Deleted ${filename}`);
					loadFiles();
				})
				.catch(err => {
					console.error(err);
					alert("Error deleting file");
				});
		}

		loadFiles();
	</script>

</body>
</html>
